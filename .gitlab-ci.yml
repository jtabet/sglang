stages:
  - build

# Build jobs are pinned to the self-managed runner (tag: gpus) because a
# 30-50GB image cannot be built on GitLab.com shared runners (10GiB dind disk).
#
# Auth: [REDACTED-0xf59b4f00] (= CI_JOB_TOKEN) grant push+pull
# on this project's registry automatically.
#
# The needs DAG below renders the pipeline graph in run order:
#   upload-base -> build-standalone -> build-ornith1-5-9b-int8
#                                          \-> build-qwen38-27b-int8
# Jobs are playable only after their dependency completes. Re-running
# upload-base later is cheap (blobs already in the registry: seconds).
#
# NOTE on long pushes: GitLab.com registry auth tokens live 15 minutes. If a
# huge push dies mid-flight with "unauthorized: authentication required",
# simply retry the job - docker resumes blob upload and skips finished layers.
#
# NOTE on long pushes: GitLab.com registry auth tokens live 15 minutes. If a
# huge push dies mid-flight with "unauthorized: authentication required",
# simply retry the job - docker resumes blob upload and skips finished layers.

upload-base:
  stage: build
  tags: [gpus]
  when: manual
  # One-time job: seeds the private registry with the local 30.7GB base so all
  # later builds deduplicate against it and only ship delta layers.
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
    # Idempotent one-time seed (2026-10-21): the original local source image
    # jtabet/sglang:kvarn-latest was pruned from the runner, but :base lives in
    # the registry — a re-run of this job must be a no-op, never a hard failure
    # that wedges the needs-DAG for every later build.
    - |
      if docker manifest inspect "$CI_REGISTRY_IMAGE:base" >/dev/null 2>&1; then
        echo "base already seeded in the registry — skipping (one-time job)"
        exit 0
      fi
    - docker tag jtabet/sglang:kvarn-latest "$CI_REGISTRY_IMAGE:base"
    - docker tag jtabet/sglang:kvarn-latest "$CI_REGISTRY_IMAGE:base-kvarn"
    - docker push "$CI_REGISTRY_IMAGE:base"
    - docker push "$CI_REGISTRY_IMAGE:base-kvarn"

build-standalone:
  stage: build
  tags: [gpus]
  when: manual
  needs: ["upload-base"]
  variables:
    GIT_DEPTH: 1
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
    - docker build --progress=plain
      --build-arg BASE_IMAGE="$CI_REGISTRY_IMAGE:base"
      -f docker/Dockerfile.kvarn-standalone
      -t "$CI_REGISTRY_IMAGE:kvarn-standalone" .
    - docker push "$CI_REGISTRY_IMAGE:kvarn-standalone"

build-ornith1-5-9b-int8:
  stage: build
  tags: [gpus]
  when: manual
  needs: ["build-standalone"]
  variables:
    GIT_DEPTH: 1
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
    - docker build --progress=plain
      -f docker/Dockerfile.ornith1.5-9b-int8
      -t "$CI_REGISTRY_IMAGE:ornith1.5-9b-int8" .
    - docker push "$CI_REGISTRY_IMAGE:ornith1.5-9b-int8"

build-qwen38-27b-int8:
  stage: build
  tags: [gpus]
  when: manual
  needs: ["build-standalone"]
  # ~30.4 GB of weights on top of the base -> same large-push caution as the
  # 9b job (retry on registry auth timeouts; docker resumes blob uploads).
  variables:
    GIT_DEPTH: 1
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
    - docker build --progress=plain
      -f docker/Dockerfile.qwen3.8-27b-int8
      -t "$CI_REGISTRY_IMAGE:qwen38-27b-int8" .
    - docker push "$CI_REGISTRY_IMAGE:qwen38-27b-int8"

cleanup-runner-disk:
  stage: build
  tags: [gpus]
  when: manual
  # NEVER deletes tagged images - only build cache and dangling layers.
  script:
    - df -h / /home || df -h /
    - docker builder prune --force --max-used-space 100GB || true
    - docker image prune --force --filter "until=168h" || true
    - df -h / /home || df -h /